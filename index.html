<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boardgaholic桌遊列表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- PapaParse: CSV 解析 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 卡片懸浮效果 */
        .game-card { transition: all 0.3s ease; }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* 難度標籤顏色 */
        .badge-easy { background-color: #dcfce7; color: #166534; }
        .badge-medium { background-color: #fef9c3; color: #854d0e; }
        .badge-hard { background-color: #fee2e2; color: #991b1b; }
        .badge-unknown { background-color: #f1f5f9; color: #64748b; }

        /* 狀態標籤 */
        .status-opened { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .status-new { background-color: #fce7f3; color: #be185d; border: 1px solid #fbcfe8; }

        /* 圖片容器 - 左側佈局 */
        .img-container {
            width: 120px; /* 固定寬度 */
            min-width: 120px;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
            border-right: 1px solid #e2e8f0;
        }
        
        /* 圖片樣式 */
        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 10;
            transition: transform 0.5s ease;
        }
        .game-card:hover .game-img {
            transform: scale(1.05);
        }

        /* 預設圖示 */
        .placeholder-icon { 
            font-size: 2rem; 
            color: #cbd5e1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 分頁按鈕樣式 */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.25rem;
            flex-wrap: wrap;
        }

        .page-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 2.5rem;
            height: 2.5rem;
            padding: 0 0.5rem;
            border-radius: 0.375rem;
            background-color: white;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .page-btn:hover:not(:disabled):not(.active) {
            background-color: #f8fafc;
            color: #4f46e5;
            border-color: #cbd5e1;
        }

        .page-btn.active {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #f1f5f9;
        }
        
        .page-dots {
            color: #94a3b8;
            padding: 0 0.25rem;
        }

        /* 頁碼下拉選單樣式 */
        .page-select {
            height: 2.5rem;
            padding: 0 2rem 0 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #e2e8f0;
            background-color: white;
            color: #64748b;
            font-size: 0.875rem;
            cursor: pointer;
            margin-left: 0.5rem;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
        .page-select:focus {
            outline: none;
            border-color: #4f46e5;
            ring: 2px solid #4f46e5;
        }

        /* 隨機按鈕樣式 */
        .sort-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .sort-btn.random {
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        .sort-btn.sequential {
            background-color: #f8fafc;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-10">

    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <!-- LOGO 圖片區塊 -->
                <img src="logo.jpg" alt="Boardgaholic Logo" class="h-12 w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <!-- 預設 Logo (如果 logo.jpg 讀取失敗時顯示) -->
                <i class="fa-solid fa-dice-d20 text-4xl text-indigo-600 hidden"></i>
                
                <div class="ml-2">
                    <h1 class="text-2xl font-bold text-slate-800">Boardgaholic桌遊列表</h1>
                    <p class="text-xs text-slate-500">資料來源: 網絡</p>
                </div>
            </div>
            <div class="text-sm text-slate-500 font-medium">
                目前共有 <span id="countDisplay" class="text-indigo-600 font-bold text-lg">0</span> 款遊戲
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8">
        
        <!-- 設定提示區塊 -->
        <div id="setupGuide" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-8">
            <div class="flex">
                <div class="flex-shrink-0"><i class="fa-solid fa-circle-exclamation text-yellow-400"></i></div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-yellow-800">尚未連結 Google Sheet</h3>
                    <div class="mt-2 text-sm text-yellow-700">
                        <p>請編輯 HTML 檔案，將 CSV 連結貼入 <code class="bg-yellow-100 px-1 rounded">GOOGLE_SHEET_CSV_URL</code>。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 載入中 -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-slate-500">正在讀取桌遊清單...</p>
        </div>

        <!-- 控制面板 -->
        <div id="controls" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
            <!-- 排序按鈕列 -->
            <div class="flex justify-end mb-4 border-b border-slate-100 pb-4">
                <button id="sortToggleBtn" class="sort-btn random">
                    <i class="fa-solid fa-shuffle"></i> <span>目前：隨機顯示</span>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- 搜尋 -->
                <div class="relative group">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">🔍 搜尋名稱</label>
                    <div class="relative">
                        <input type="text" id="searchInput" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="輸入中文或英文...">
                        <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1 ml-1">*搜尋時自動切換為序號排列</p>
                </div>
                <!-- 人數 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">👥 玩家人數</label>
                    <div class="relative">
                        <input type="number" id="playerInput" min="1" max="99" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="例如: 4">
                        <i class="fa-solid fa-users absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>
                <!-- 難度 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">🧠 策略難度</label>
                    <div class="relative">
                        <select id="difficultySelect" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent appearance-none cursor-pointer transition-all">
                            <option value="all">全部難度</option>
                            <option value="easy">🟢 輕鬆入門 (1.0 - 1.9)</option>
                            <option value="medium">🟡 中度策略 (2.0 - 2.9)</option>
                            <option value="hard">🔴 重度燒腦 (3.0+)</option>
                        </select>
                        <i class="fa-solid fa-puzzle-piece absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>
                <!-- 狀態 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">📦 遊玩狀態</label>
                    <div class="relative">
                        <select id="statusSelect" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent appearance-none cursor-pointer transition-all">
                            <option value="all">全部狀態</option>
                            <option value="opened">🔓 已遊玩</option>
                            <option value="new">🔒 未遊玩</option>
                        </select>
                        <i class="fa-solid fa-box absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分頁控制 (頂部) -->
        <div id="paginationTop" class="hidden mb-6 pagination-container">
            <!-- JS 動態生成 -->
        </div>

        <!-- 遊戲列表網格 -->
        <div id="gameGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 min-h-[200px]">
            <!-- JS 將在此處插入卡片 -->
        </div>

        <!-- 空狀態 -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-100 mb-6">
                <i class="fa-solid fa-ghost text-4xl text-slate-300"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-700 mb-2">找不到符合的遊戲</h3>
            <p class="text-slate-500">試著調整搜尋條件或是人數限制看看？</p>
        </div>

        <!-- 分頁控制 (底部) -->
        <div id="paginationBottom" class="hidden mt-8 pagination-container">
             <!-- JS 動態生成 -->
        </div>
    </div>

    <script>
        // ==========================================
        // ▼ 請在這裡貼上您的 Google Sheet CSV 連結 ▼
        // ==========================================
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSr7Ld-M_wkK6_pzozlsVRQgX8g8lxtjsWRibH4RB-8XjFdGtdM2-4oDI7vDkH2pA/pub?output=csv'; 
        
        // 設定每頁顯示數量
        const ITEMS_PER_PAGE = 12;
        
        let gamesData = [];
        let currentPage = 1;
        let filteredGames = []; // 儲存篩選後的結果
        let isRandomMode = true; // 預設為隨機模式

        // DOM 元素
        const elements = {
            grid: document.getElementById('gameGrid'),
            empty: document.getElementById('emptyState'),
            loading: document.getElementById('loading'),
            controls: document.getElementById('controls'),
            guide: document.getElementById('setupGuide'),
            imageGuide: document.getElementById('imageGuide'),
            count: document.getElementById('countDisplay'),
            paginationTop: document.getElementById('paginationTop'),
            paginationBottom: document.getElementById('paginationBottom'),
            sortBtn: document.getElementById('sortToggleBtn'),
            inputs: {
                search: document.getElementById('searchInput'),
                player: document.getElementById('playerInput'),
                diff: document.getElementById('difficultySelect'),
                status: document.getElementById('statusSelect')
            }
        };

        function init() {
            if (!GOOGLE_SHEET_CSV_URL) {
                elements.loading.classList.add('hidden');
                elements.guide.classList.remove('hidden');
                elements.controls.classList.remove('hidden');
                // 模擬資料以測試分頁 (包含文字ID)
                gamesData = Array.from({length: 250}, (_, i) => ({
                    id: (i % 10 === 0) ? `${i}A` : `${i+1}`, // 測試: 10A, 20A...
                    opened: i%2===0, nameZh:`測試遊戲 ${i+1}`, nameEn:`Test Game ${i+1}`, min:2, max:4, weight: 1.0 + (i%3)
                }));
                applyFilters();
            } else {
                fetchData();
            }
            updateSortButtonUI();
        }

        function fetchData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    processData(results.data);
                    elements.loading.classList.add('hidden');
                    elements.controls.classList.remove('hidden');
                    applyFilters();
                },
                error: function(err) {
                    console.error("CSV 解析錯誤:", err);
                    alert("讀取失敗，請檢查網路或連結。");
                    elements.loading.classList.add('hidden');
                }
            });
        }

        function processData(rawData) {
            gamesData = rawData
                .filter(row => row['中文名稱'] && row['中文名稱'].trim() !== '')
                .map(row => {
                    let isOpened = false;
                    const openedVal = String(row['已開']).toLowerCase().trim();
                    if (openedVal === 'true' || openedVal === 'yes' || openedVal === '是') isOpened = true;

                    const weight = parseFloat(row['BGG Difficulty']);
                    
                    // 修正：不使用 parseInt，而是保留原始字串並去除空白
                    // 這樣 143A 就不會變成 143
                    return {
                        id: row['編號'] ? row['編號'].trim() : '', 
                        opened: isOpened,
                        nameZh: row['中文名稱'],
                        nameEn: row['英文名稱'] || '',
                        min: parseInt(row['最少人數']) || 1,
                        max: parseInt(row['最大人數']) || 99,
                        weight: isNaN(weight) ? null : weight
                    };
                });
        }

        // Fisher-Yates 洗牌演算法
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function toggleSortMode() {
            isRandomMode = !isRandomMode;
            updateSortButtonUI();
            applyFilters(); // 重新過濾並排序
        }

        function updateSortButtonUI() {
            const btn = elements.sortBtn;
            if (isRandomMode) {
                btn.innerHTML = '<i class="fa-solid fa-shuffle"></i> <span>目前：隨機顯示</span>';
                btn.classList.remove('sequential');
                btn.classList.add('random');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-arrow-down-1-9"></i> <span>目前：序號排列</span>';
                btn.classList.remove('random');
                btn.classList.add('sequential');
            }
        }

        function applyFilters() {
            const searchText = elements.inputs.search.value.toLowerCase().trim();
            const players = parseInt(elements.inputs.player.value);
            const difficulty = elements.inputs.diff.value;
            const status = elements.inputs.status.value;

            // 1. 先進行篩選
            let tempGames = gamesData.filter(game => {
                const matchText = (game.nameZh && game.nameZh.toLowerCase().includes(searchText)) || 
                                  (game.nameEn && game.nameEn.toLowerCase().includes(searchText));
                
                let matchPlayers = true;
                if (!isNaN(players)) {
                    matchPlayers = players >= game.min && players <= game.max;
                }

                let matchDiff = true;
                if (difficulty !== 'all') {
                    if (game.weight === null) {
                        matchDiff = false;
                    } else {
                        if (difficulty === 'easy') matchDiff = game.weight < 2.0;
                        else if (difficulty === 'medium') matchDiff = game.weight >= 2.0 && game.weight < 3.0;
                        else if (difficulty === 'hard') matchDiff = game.weight >= 3.0;
                    }
                }

                let matchStatus = true;
                if (status !== 'all') {
                    if (status === 'opened') matchStatus = game.opened === true;
                    if (status === 'new') matchStatus = game.opened === false;
                }

                return matchText && matchPlayers && matchDiff && matchStatus;
            });

            // 2. 處理排序邏輯
            // 自然排序比較器 (Natural Sort Comparator)
            // 這能讓 "2" 排在 "10" 前面，"143" 排在 "143A" 前面
            const naturalSort = (a, b) => {
                return a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' });
            };

            // 如果正在搜尋 (searchText不為空)，強制使用 ID 排序
            if (searchText.length > 0) {
                tempGames.sort(naturalSort);
            } 
            // 如果沒有搜尋，依據 isRandomMode 決定
            else if (isRandomMode) {
                // 如果是隨機模式，進行洗牌
                shuffleArray(tempGames);
            } else {
                // 如果是序號模式，按 ID 自然排序
                tempGames.sort(naturalSort);
            }

            filteredGames = tempGames;
            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            elements.count.textContent = filteredGames.length;
            elements.grid.innerHTML = '';

            const totalPages = Math.ceil(filteredGames.length / ITEMS_PER_PAGE);

            if (filteredGames.length === 0) {
                elements.grid.classList.add('hidden');
                elements.empty.classList.remove('hidden');
                elements.paginationTop.classList.add('hidden');
                elements.paginationBottom.classList.add('hidden');
                return;
            } else {
                elements.grid.classList.remove('hidden');
                elements.empty.classList.add('hidden');
            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const pageItems = filteredGames.slice(startIndex, endIndex);

            pageItems.forEach(game => {
                let diffBadgeClass = 'badge-unknown';
                let diffText = 'N/A';
                if (game.weight !== null) {
                    diffText = game.weight.toFixed(2);
                    if (game.weight < 2.0) diffBadgeClass = 'badge-easy';
                    else if (game.weight < 3.0) diffBadgeClass = 'badge-medium';
                    else diffBadgeClass = 'badge-hard';
                }

                const statusBadge = game.opened ? 
                    `<span class="px-2 py-0.5 rounded text-xs font-bold status-opened">已遊玩</span>` : 
                    `<span class="px-2 py-0.5 rounded text-xs font-bold status-new">未遊玩</span>`;

                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(game.nameEn + " board game")}`;
                
                const localImagePath = `pic/${game.id}.jpg`;
                
                const imageHtml = `
                    <i class="fa-solid fa-dice-d20 placeholder-icon"></i>
                    <img src="${localImagePath}" 
                         alt="${game.nameZh}" 
                         class="game-img"
                         loading="lazy" 
                         onerror="this.style.display='none'">
                `;

                const cardHTML = `
                    <div class="game-card bg-white rounded-xl shadow border border-slate-100 overflow-hidden flex flex-row h-[160px] relative group cursor-pointer" onclick="window.open('${searchUrl}', '_blank')">
                        <div class="img-container">
                            ${imageHtml}
                        </div>
                        
                        <div class="p-4 flex-grow flex flex-col justify-between overflow-hidden">
                            <div>
                                <div class="flex justify-between items-start mb-1">
                                    <span class="text-xs font-mono text-slate-400">#${game.id}</span>
                                    ${statusBadge}
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 leading-tight truncate" title="${game.nameZh}">${game.nameZh}</h3>
                                <p class="text-sm text-slate-500 italic truncate" title="${game.nameEn}">${game.nameEn}</p>
                            </div>
                            
                            <div class="flex gap-2 mt-2">
                                <div class="flex items-center text-sm text-slate-600 bg-slate-50 px-2 py-1 rounded border border-slate-100">
                                    <i class="fa-solid fa-users w-4 text-center text-slate-400 mr-1.5 text-xs"></i>
                                    <span class="font-medium text-xs">${game.min}-${game.max}人</span>
                                </div>
                                <div class="flex items-center text-sm text-slate-600 bg-slate-50 px-2 py-1 rounded border border-slate-100">
                                    <i class="fa-solid fa-brain w-4 text-center text-slate-400 mr-1.5 text-xs"></i>
                                    <span class="px-1.5 py-0.5 rounded-full text-xs font-bold ${diffBadgeClass}">${diffText}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-5 transition-all pointer-events-none"></div>
                    </div>
                `;
                elements.grid.insertAdjacentHTML('beforeend', cardHTML);
            });

            renderPaginationControls(totalPages);
        }

        function renderPaginationControls(totalPages) {
            if (totalPages <= 1) {
                elements.paginationTop.classList.add('hidden');
                elements.paginationBottom.classList.add('hidden');
                return;
            }

            elements.paginationTop.classList.remove('hidden');
            elements.paginationBottom.classList.remove('hidden');

            const paginationHTML = generateSmartPaginationHTML(totalPages);
            elements.paginationTop.innerHTML = paginationHTML;
            elements.paginationBottom.innerHTML = paginationHTML;

            bindPaginationEvents();
        }

        function generateSmartPaginationHTML(totalPages) {
            let html = '';
            
            // 上一頁
            html += `<button class="page-btn prev-btn" ${currentPage === 1 ? 'disabled' : ''}><i class="fa-solid fa-chevron-left"></i></button>`;

            // 數字按鈕邏輯
            const delta = 1;
            const range = [];
            const rangeWithDots = [];

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - delta && i <= currentPage + delta)) {
                    range.push(i);
                }
            }

            let l;
            for (let i of range) {
                if (l) {
                    if (i - l === 2) {
                        rangeWithDots.push(l + 1);
                    } else if (i - l !== 1) {
                        rangeWithDots.push('...');
                    }
                }
                rangeWithDots.push(i);
                l = i;
            }

            for (let item of rangeWithDots) {
                if (item === '...') {
                    html += `<span class="page-dots">...</span>`;
                } else {
                    const activeClass = item === currentPage ? 'active' : '';
                    html += `<button class="page-btn num-btn ${activeClass}" data-page="${item}">${item}</button>`;
                }
            }

            // 下一頁
            html += `<button class="page-btn next-btn" ${currentPage === totalPages ? 'disabled' : ''}><i class="fa-solid fa-chevron-right"></i></button>`;

            // 下拉式跳頁選單
            html += `<select class="page-select jump-select">`;
            for(let i=1; i<=totalPages; i++) {
                html += `<option value="${i}" ${i === currentPage ? 'selected' : ''}>第 ${i} 頁</option>`;
            }
            html += `</select>`;

            return html;
        }

        function bindPaginationEvents() {
            // 數字按鈕
            document.querySelectorAll('.num-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const page = parseInt(e.target.dataset.page);
                    if (page !== currentPage) {
                        currentPage = page;
                        renderPage();
                        scrollToTop();
                    }
                });
            });

            // 上一頁
            document.querySelectorAll('.prev-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderPage();
                        scrollToTop();
                    }
                });
            });

            // 下一頁
            document.querySelectorAll('.next-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const totalPages = Math.ceil(filteredGames.length / ITEMS_PER_PAGE);
                    if (currentPage < totalPages) {
                        currentPage++;
                        renderPage();
                        scrollToTop();
                    }
                });
            });

            // 跳頁下拉選單
            document.querySelectorAll('.jump-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    currentPage = parseInt(e.target.value);
                    renderPage();
                    scrollToTop();
                });
            });
        }

        function scrollToTop() {
            elements.controls.scrollIntoView({ behavior: 'smooth' });
        }

        // 綁定篩選事件
        Object.values(elements.inputs).forEach(input => {
            input.addEventListener('input', applyFilters);
            input.addEventListener('change', applyFilters);
        });

        // 綁定排序按鈕
        elements.sortBtn.addEventListener('click', toggleSortMode);

        init();
    </script>
</body>
</html>
